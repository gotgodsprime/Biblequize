<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bible Blitz: Party Edition</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --surface: rgba(30, 41, 59, 0.45);
            --surface-accent: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --gold: #fbbf24;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background: #0f172a;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 1) 0px, #0f172a 100%);
            z-index: -2;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        #intro-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .logo-container { text-align: center; }
        .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            background: linear-gradient(to right, #ffffff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation: cinematicFade 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes cinematicFade {
            0% { opacity: 0; transform: translateY(20px); letter-spacing: 0.3em; }
            40% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); letter-spacing: 0.15em; }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .app-shell {
            width: 90%;
            max-width: 430px;
            background: var(--surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 35px 25px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            transform: translateY(40px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .app-shell.active { transform: translateY(0); opacity: 1; }

        .view { display: flex; flex-direction: column; }
        .hidden { display: none !important; }

        h1 { font-size: 1.8rem; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-sub); text-align: center; font-size: 0.9rem; margin-bottom: 25px; }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); box-shadow: none; margin-top: 12px; }
        .btn-next { background: var(--text-main); color: #0f172a; box-shadow: none; }

        .section-label { font-size: 0.75rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin: 20px 0 8px 4px; letter-spacing: 1px; }
        .grid-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .cat-grid { grid-template-columns: repeat(2, 1fr); }
        
        .pill-btn {
            padding: 14px 10px;
            border: 1px solid var(--border);
            background: var(--surface-accent);
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        .pill-btn.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.2); color: white; }

        .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.5px; }
        .lives { color: var(--error); letter-spacing: 2px; }
        .streak-pill { background: var(--warning); color: #000; padding: 4px 12px; border-radius: 100px; font-weight: 900; font-size: 0.75rem; }
        
        .timer-track { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 100px; margin-bottom: 20px; overflow: hidden; }
        .timer-bar { width: 100%; height: 100%; background: var(--primary); transform-origin: left; transition: transform 0.1s linear; }

        .scrambled {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 20px 0;
            text-align: center;
            letter-spacing: 6px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.4));
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 18px;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        input:focus { background: rgba(255, 255, 255, 0.12); border-color: var(--primary); }

        .feedback { text-align: center; font-weight: 700; min-height: 24px; margin-top: 15px; font-size: 0.95rem; }

        /* Setup / Leaderboard Styles */
        .player-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .player-input-row input { margin-bottom: 0; padding: 14px; font-size: 1rem; text-align: left; }
        
        .leaderboard-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-accent);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .leaderboard-rank { font-weight: 900; color: var(--gold); font-size: 1.1rem; width: 30px; }
        .leaderboard-name { flex-grow: 1; font-weight: 700; }
        .leaderboard-score { font-weight: 800; color: var(--success); }

        .turn-announcer {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #fff;
        }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .shake { animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<body>

    <div class="bg-mesh"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- 🎬 Intro Screen -->
    <div id="intro-screen">
        <div class="logo-container">
            <div class="logo-text">BIBLE BLITZ</div>
        </div>
    </div>

    <!-- 🎨 Universal App Wrapper -->
    <div class="app-shell" id="app-shell">
        
        <!-- 🏠 VIEW: DASHBOARD -->
        <div id="view-dash" class="view">
            <h1>Bible Blitz</h1>
            <p class="subtitle">Premium Scriptural Enigma Game</p>

            <button class="btn" onclick="switchActiveView('view-setup')">👥 Pass & Play Mode</button>
            <button class="btn btn-secondary" onclick="startSinglePlayerSetup()">👤 Solo Campaign</button>
        </div>

        <!-- 👥 VIEW: MULTIPLAYER SETUP -->
        <div id="view-setup" class="view hidden">
            <h1>Player Setup</h1>
            <p class="subtitle">Add competitors for local blitz</p>
            
            <div id="player-inputs-container">
                <div class="player-input-row">
                    <input type="text" class="player-name-field" placeholder="Player 1 Name" value="Player 1" spellcheck="false" autocomplete="off">
                </div>
                <div class="player-input-row">
                    <input type="text" class="player-name-field" placeholder="Player 2 Name" value="Player 2" spellcheck="false" autocomplete="off">
                </div>
            </div>

            <button class="btn btn-secondary" style="margin-top: 0; margin-bottom: 20px;" onclick="addPlayerInputField()">➕ Add Competitor</button>

            <div class="section-label">Difficulty Settings</div>
            <div class="grid-select">
                <button class="pill-btn active" data-type="diff" onclick="setPreference('diff', 'easy', this)">Easy</button>
                <button class="pill-btn" data-type="diff" onclick="setPreference('diff', 'medium', this)">Medium</button>
                <button class="pill-btn" data-type="diff" onclick="setPreference('diff', 'hard', this)">Hard</button>
            </div>

            <div class="section-label">Category Indexes</div>
            <div class="grid-select cat-grid">
                <button class="pill-btn active" data-type="cat" onclick="setPreference('cat', 'all', this)">All Words</button>
                <button class="pill-btn" data-type="cat" onclick="setPreference('cat', 'ot', this)">Old Test.</button>
                <button class="pill-btn" data-type="cat" onclick="setPreference('cat', 'nt', this)">New Test.</button>
                <button class="pill-btn" data-type="cat" onclick="setPreference('cat', 'women', this)">Women</button>
            </div>

            <button class="btn" style="margin-top: 25px;" onclick="initPartySession()">Launch Match</button>
            <button class="btn btn-secondary" onclick="switchActiveView('view-dash')">Cancel</button>
        </div>

        <!-- 🎮 VIEW: GAMEPLAY LOOP -->
        <div id="view-game" class="view hidden">
            <div id="active-turn-hud" class="turn-announcer">Player Turn</div>
            <div class="hud">
                <div>SCORE: <span id="game-score">0</span></div>
                <div id="game-streak-pill" class="streak-pill hidden">🔥 <span id="game-streak-val">0</span></div>
                <div class="lives" id="game-lives">❤️❤️❤️</div>
            </div>

            <div class="timer-track">
                <div class="timer-bar" id="game-timer"></div>
            </div>

            <div class="scrambled" id="scrambled-target">----</div>
            <input type="text" id="game-input" placeholder="Deduce name..." spellcheck="false" autocomplete="off">
            <button class="btn" id="game-action-btn" onclick="submitGuessedAnswer()">Validate</button>
            <div class="feedback" id="game-feedback"></div>
        </div>

        <!-- 🏁 VIEW: MULTIPLAYER FINAL LEADERBOARD -->
        <div id="view-end" class="view hidden">
            <h1>Podium Standings</h1>
            <p class="subtitle">Final game performance summary</p>

            <div class="leaderboard-list" id="leaderboard-insertion-point">
                <!-- Injected dynamically -->
            </div>

            <button class="btn" onclick="switchActiveView('view-dash')">Dismiss Match</button>
        </div>
    </div>

    <script>
        const VOCABULARY_DICTIONARY = {
            easy: {
                all: ["Peter", "Mary", "Ruth", "Noah", "David", "Adam", "Eve", "John", "Mark", "Paul", "Isaac"],
                ot: ["Noah", "David", "Adam", "Eve", "Isaac"],
                nt: ["Peter", "Mary", "John", "Mark", "Paul"],
                women: ["Mary", "Ruth", "Eve"]
            },
            medium: {
                all: ["Elizabeth", "Abraham", "Elijah", "Lazarus", "Gideon", "Samson", "Deborah", "Solomon", "Esther", "Samuel"],
                ot: ["Abraham", "Elijah", "Gideon", "Samson", "Deborah", "Solomon", "Samuel"],
                nt: ["Elizabeth", "Lazarus"],
                women: ["Elizabeth", "Deborah", "Esther"]
            },
            hard: {
                all: ["Nebuchadnezzar", "Melchizedek", "Methuselah", "Hezekiah", "Sennacherib", "Zerubbabel", "Jehoiakim", "Mephibosheth"],
                ot: ["Nebuchadnezzar", "Melchizedek", "Methuselah", "Hezekiah", "Sennacherib", "Zerubbabel", "Jehoiakim", "Mephibosheth"],
                nt: ["Melchizedek"], 
                women: ["Athaliah", "Maacah", "Zipporah"] 
            }
        };

        let activePrefs = { diff: 'easy', cat: 'all' };
        let partyPlayers = [];
        let currentPlayerIndex = 0;
        
        let liveSession = { pool: [], index: 0, score: 0, speedBonus: 0, streak: 0, lives: 3, timeLeft: 100, lockTurn: false };
        let coreSystemClock = null;

        window.onload = () => {
            initBackgroundParticles();
            setTimeout(() => {
                document.getElementById('intro-screen').style.transform = 'translateY(-100%)';
                setTimeout(() => {
                    document.getElementById('app-shell').classList.add('active');
                }, 400);
            }, 2200);
        };

        // 🧿 CANVAS PARTICLES ENGINE
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particleArray = [];

        function initBackgroundParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particleArray = [];
            for(let i=0; i<35; i++) {
                particleArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.5 + 0.5,
                    speedY: Math.random() * 0.4 + 0.1,
                    alpha: Math.random() * 0.4 + 0.1
                });
            }
            renderParticleLoop();
        }

        function renderParticleLoop() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            for(let i=0; i<particleArray.length; i++) {
                let p = particleArray[i];
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speedY;
                if(p.y < 0) p.y = canvas.height;
            }
            requestAnimationFrame(renderParticleLoop);
        }
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        // 🎵 CORE HARDWARE OSCILLATOR SYNTHESIZER
        function playSynthesizedAudio(flavor) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                if (flavor === 'right') {
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.22);
                } else if (flavor === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.22);
                } else if (flavor === 'victory') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
                    osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.24);
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.45);
                }
            } catch(error) { console.log("Audio contexts blocked."); }
        }

        function invokeHapticFeedback(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        function calculateScramble(word) {
            let splitArr = word.toUpperCase().split(''), iterations = splitArr.length;
            while (iterations--) {
                let randomTarget = Math.floor(Math.random() * (iterations + 1));
                [splitArr[iterations], splitArr[randomTarget]] = [splitArr[randomTarget], splitArr[iterations]];
            }
            return splitArr.join('');
        }

        function setPreference(category, value, element) {
            activePrefs[category] = value;
            document.querySelectorAll(`[data-type="${category}"]`).forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function switchActiveView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        // 👥 PARTY EXTRA SETTINGS SETUP
        function addPlayerInputField() {
            const container = document.getElementById('player-inputs-container');
            const count = container.children.length + 1;
            if(count > 6) return alert("Maximum party limit is 6 local players.");
            
            const div = document.createElement('div');
            div.className = 'player-input-row';
            div.innerHTML = `<input type="text" class="player-name-field" placeholder="Player ${count} Name" value="Player ${count}" spellcheck="false" autocomplete="off">`;
            container.appendChild(div);
        }

        function startSinglePlayerSetup() {
            partyPlayers = [{ name: "Solo Runner", score: 0 }];
            currentPlayerIndex = 0;
            switchActiveView('view-setup');
            // Hard clean multi-inputs to solo view variant
            document.getElementById('player-inputs-container').innerHTML = `
                <div class="player-input-row">
                    <input type="text" class="player-name-field" placeholder="Your Name" value="Champion" spellcheck="false" autocomplete="off">
                </div>`;
        }

        function initPartySession() {
            partyPlayers = [];
            const fields = document.querySelectorAll('.player-name-field');
            fields.forEach(f => {
                let val = f.value.trim();
                if(val !== "") partyPlayers.push({ name: val, score: 0 });
            });

            if(partyPlayers.length === 0) partyPlayers.push({ name: "Player 1", score: 0 });
            
            currentPlayerIndex = 0;
            launchIndividualPlayerTurn();
        }

        function launchIndividualPlayerTurn() {
            let selectedPool = VOCABULARY_DICTIONARY[activePrefs.diff][activePrefs.cat];
            if(!selectedPool || selectedPool.length === 0) selectedPool = VOCABULARY_DICTIONARY[activePrefs.diff]['all'];
            
            // Generate 5 distinct random words per player assignment 
            liveSession.pool = selectedPool.map(strName => ({ original: strName, scrambled: calculateScramble(strName) })).sort(() => Math.random() - 0.5).slice(0, 5);
            liveSession.index = 0;
            liveSession.score = 0;
            liveSession.speedBonus = 0;
            liveSession.streak = 0;
            liveSession.lives = 3;
            liveSession.lockTurn = false;

            switchActiveView('view-game');
            syncHUD();
            displayCurrentRound();
        }

        function syncHUD() {
            document.getElementById('active-turn-hud').textContent = `🎮 ${partyPlayers[currentPlayerIndex].name}'s Turn`;
            document.getElementById('game-score').textContent = liveSession.score;
            document.getElementById('game-lives').textContent = "❤️".repeat(liveSession.lives);
            
            const streakPill = document.getElementById('game-streak-pill');
            if (liveSession.streak > 0) {
                streakPill.classList.remove('hidden');
                document.getElementById('game-streak-val').textContent = liveSession.streak;
            } else {
                streakPill.classList.add('hidden');
            }
        }

        function displayCurrentRound() {
            if(liveSession.index >= liveSession.pool.length || liveSession.lives <= 0) {
                return concludeIndividualPlayerTurn();
            }
            liveSession.lockTurn = false;
            document.getElementById('scrambled-target').textContent = liveSession.pool[liveSession.index].scrambled;
            
            const txtInput = document.getElementById('game-input');
            txtInput.value = ""; txtInput.disabled = false; txtInput.focus();
            
            const subBtn = document.getElementById('game-action-btn');
            subBtn.textContent = "Validate"; subBtn.className = "btn";
            document.getElementById('game-feedback').textContent = "";
            
            executeChronographTimer();
        }

        function executeChronographTimer() {
            clearInterval(coreSystemClock);
            liveSession.timeLeft = 100;
            const barGraphic = document.getElementById('game-timer');
            let incrementalDrain = activePrefs.diff === 'easy' ? 0.7 : activePrefs.diff === 'medium' ? 1.3 : 2.2;

            coreSystemClock = setInterval(() => {
                liveSession.timeLeft -= incrementalDrain;
                if(liveSession.timeLeft <= 0) {
                    liveSession.timeLeft = 0;
                    clearInterval(coreSystemClock);
                    evaluateSubmissionData(true);
                }
                barGraphic.style.transform = `scaleX(${liveSession.timeLeft / 100})`;
            }, 100);
        }

        function submitGuessedAnswer() {
            if (liveSession.lockTurn) {
                liveSession.index++;
                displayCurrentRound();
                return;
            }
            evaluateSubmissionData(false);
        }

        function evaluateSubmissionData(forcedTimeout) {
            clearInterval(coreSystemClock);
            liveSession.lockTurn = true;
            
            const textElement = document.getElementById('game-input');
            let processingGuess = textElement.value.trim().toLowerCase();
            let actualSolution = liveSession.pool[liveSession.index].original.toLowerCase();

            if (!forcedTimeout && processingGuess === actualSolution) {
                liveSession.score += 10;
                liveSession.streak++;

                let velocityBonusPoints = 0;
                if(liveSession.timeLeft > 50) {
                    velocityBonusPoints = Math.round((liveSession.timeLeft - 50) / 8);
                    liveSession.score += velocityBonusPoints;
                }

                invokeHapticFeedback(40);
                playSynthesizedAudio('right');
                document.getElementById('game-feedback').innerHTML = `<span style="color:var(--success)">✨ Perfect! +${10 + velocityBonusPoints} Points!</span>`;
            } else {
                liveSession.lives--;
                liveSession.streak = 0;

                invokeHapticFeedback([90, 40, 90]);
                playSynthesizedAudio('wrong');
                
                const frameShell = document.getElementById('app-shell');
                frameShell.classList.add('shake');
                setTimeout(() => frameShell.classList.remove('shake'), 300);

                let reportAlertString = forcedTimeout ? "⏰ Out of Time!" : "❌ Incorrect!";
                document.getElementById('game-feedback').innerHTML = `<span style="color:var(--error)">${reportAlertString} Solution: ${liveSession.pool[liveSession.index].original}</span>`;
            }
            
            textElement.disabled = true;
            syncHUD();
            
            const subBtn = document.getElementById('game-action-btn');
            subBtn.textContent = "Proceed";
            subBtn.className = "btn btn-next";
        }

        function concludeIndividualPlayerTurn() {
            clearInterval(coreSystemClock);
            partyPlayers[currentPlayerIndex].score = liveSession.score;

            currentPlayerIndex++;
            if(currentPlayerIndex < partyPlayers.length) {
                alert(`Next up: ${partyPlayers[currentPlayerIndex].name}! Pass the device.`);
                launchIndividualPlayerTurn();
            } else {
                displayGrandLeaderboard();
            }
        }

        function displayGrandLeaderboard() {
            // Sort leaderboard rankings based on highest score metrics
            partyPlayers.sort((a,b) => b.score - a.score);
            
            const InsertionContainer = document.getElementById('leaderboard-insertion-point');
            InsertionContainer.innerHTML = "";

            partyPlayers.forEach((player, rankIdx) => {
                const item = document.createElement('div');
                item.className = "leaderboard-item";
                
                let medal = rankIdx === 0 ? "🥇" : rankIdx === 1 ? "🥈" : rankIdx === 2 ? "🥉" : `#${rankIdx + 1}`;
                
                item.innerHTML = `
                    <div class="leaderboard-rank">${medal}</div>
                    <div class="leaderboard-name">${player.name}</div>
                    <div class="leaderboard-score">${player.score} pts</div>
                `;
                InsertionContainer.appendChild(item);
            });

            playSynthesizedAudio('victory');
            switchActiveView('view-end');
        }

        document.getElementById('game-input').addEventListener('keypress', event => {
            if(event.key === 'Enter') submitGuessedAnswer();
        });
    </script>
</body>
</html>

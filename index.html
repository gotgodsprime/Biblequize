<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bible Blitz: Universal</title>
    <style>
        :root {
            /* Adaptive Color Palette */
            --primary: #6366f1;
            --accent: #f59e0b;
            --surface: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        /* 🎨 Universal Premium Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #0f172a; /* Deep Slate Base */
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🧿 Subtle Mesh Gradient (Android/iOS hybrid style) */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            z-index: -1;
        }

        /* 🎬 Cinematic Intro Screen */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1);
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            background: linear-gradient(to right, #fff, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite ease-in-out;
        }

        /* 🎨 Universal Glass Card */
        .app-shell {
            width: 90%;
            max-width: 420px;
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .app-shell.active { transform: translateY(0); opacity: 1; }

        /* 🎮 Game UI Elements */
        .scrambled {
            font-size: 3rem;
            font-weight: 900;
            margin: 40px 0;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 20px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active { transform: scale(0.96); opacity: 0.9; }

        /* 🔥 Streak Badge (Material Style) */
        .streak-pill {
            display: inline-block;
            background: var(--accent);
            color: #000;
            padding: 6px 16px;
            border-radius: 100px;
            font-weight: 900;
            font-size: 0.75rem;
            margin-bottom: 20px;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .hidden { display: none; }

    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <div id="intro-screen">
        <div class="logo-text">BIBLE BLITZ</div>
    </div>

    <div class="app-shell" id="app-shell">
        <!-- Main Dashboard -->
        <div id="dash-view">
            <div style="text-align: center;">
                <h1 style="margin: 0; font-size: 1.5rem;">Daily Challenge</h1>
                <p style="color: var(--text-secondary); margin: 10px 0 30px;">Unscramble the holy names.</p>
                <button class="btn" onclick="startGame()">Start Game</button>
            </div>
        </div>

        <!-- Game Area -->
        <div id="game-view" class="hidden">
            <div style="text-align: center;">
                <div id="streak-badge" class="streak-pill hidden">🔥 STREAK: 0</div>
                <div class="scrambled" id="scramble-box">----</div>
                <input type="text" id="guess-input" placeholder="Type here..." spellcheck="false" autocomplete="off">
                <button class="btn" onclick="checkAnswer()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        const names = ["MOSES", "ABRAHAM", "ESTHER", "SOLOMON", "ELIJAH", "REBEKAH", "PETER", "MARTHA"];
        let currentTarget = "";
        let streak = 0;

        // 🎬 Intro Sequence (Compatible with all browsers)
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('intro-screen').style.transform = 'translateY(-100%)';
                setTimeout(() => {
                    document.getElementById('app-shell').classList.add('active');
                }, 400);
            }, 2000);
        };

        function startGame() {
            document.getElementById('dash-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            nextWord();
        }

        function scramble(word) {
            let arr = word.split(''), i = arr.length;
            while(i--) {
                let j = Math.floor(Math.random()*(i+1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.join('');
        }

        function nextWord() {
            currentTarget = names[Math.floor(Math.random() * names.length)];
            document.getElementById('scramble-box').textContent = scramble(currentTarget);
            document.getElementById('guess-input').value = "";
            document.getElementById('guess-input').focus();
        }

        function checkAnswer() {
            const guess = document.getElementById('guess-input').value.trim().toUpperCase();
            const badge = document.getElementById('streak-badge');

            if (guess === currentTarget) {
                streak++;
                badge.classList.remove('hidden');
                badge.textContent = `🔥 STREAK: ${streak}`;
                
                // Android-style haptic (if supported)
                if(navigator.vibrate) navigator.vibrate(50);
                
                nextWord();
            } else {
                streak = 0;
                badge.classList.add('hidden');
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                alert("Almost! The answer was: " + currentTarget);
                nextWord();
            }
        }

        // Enter key support
        document.getElementById('guess-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
